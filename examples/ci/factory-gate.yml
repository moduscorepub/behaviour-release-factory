# Deployment template: copy to .github/workflows/ in the repository that holds your behaviours.
# Required check for the protected branch. merge_group makes the evidence bind to
# (target branch + queued changes), not a stale PR head.
#
# Needs a protected "factory-authority" environment holding:
#   FACTORY_TRUST_TARBALL  base64 tar.gz of trust/ (pins.json, approvals.json) and state/ (release store)
#   FACTORY_RUNNER_KEY     hex runner key (never stored in the repository)
name: factory-gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: factory-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cancel merge-queue runs

jobs:
  builder-sandbox:
    name: builder-sandbox
    runs-on: ubuntu-latest
    environment: factory-authority
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Restore authority material (pins, approvals; no key needed here)
        run: echo "$FACTORY_TRUST_TARBALL" | base64 -d | tar -xz
        env:
          FACTORY_TRUST_TARBALL: ${{ secrets.FACTORY_TRUST_TARBALL }}
      - name: Install openshell-prover v0.1.2 (static musl build, checksum-verified)
        run: |
          base=https://github.com/NVIDIA/OpenShell/releases/download/v0.1.2
          asset=openshell-prover-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO "$base/$asset" && curl -fsSLO "$base/openshell-prover-checksums-sha256.txt"
          grep " \*\?$asset\$" openshell-prover-checksums-sha256.txt | sha256sum -c -
          mkdir -p .tools/bin && tar -xzf "$asset" -C .tools/bin openshell-prover
      - run: uv run --frozen python -m factory sandbox-check

  gate:
    name: gate
    runs-on: ubuntu-latest
    environment: factory-authority
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Restore authority material and release state
        run: echo "$FACTORY_TRUST_TARBALL" | base64 -d | tar -xz
        env:
          FACTORY_TRUST_TARBALL: ${{ secrets.FACTORY_TRUST_TARBALL }}
      - name: Compile, evidence and gate every behaviour in the candidate
        env:
          FACTORY_RUNNER_KEY: ${{ secrets.FACTORY_RUNNER_KEY }} # parent only; the worker environment is scrubbed of FACTORY_*
        run: |
          status=0
          for dir in behaviours/*/; do
            b=$(basename "$dir")
            uv run --frozen python -m factory compile "$b" || true   # diagnostics become failed static obligations
            uv run --frozen python -m factory evidence "$b" || true  # failures are recorded, then judged by the gate
            uv run --frozen python -m factory gate "$b" > "gate-$b.json" || status=1
          done
          exit $status
