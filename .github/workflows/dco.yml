# Every commit in a pull request must carry a Signed-off-by trailer matching its author (DCO 1.1).
name: dco

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signoff:
    name: signoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            case "$author" in *'[bot]@users.noreply.github.com>') continue ;; esac  # GitHub Apps (e.g. Dependabot) cannot sign off
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::commit $c lacks 'Signed-off-by: $author' (see CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit $missing
