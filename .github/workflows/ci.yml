# Self-contained verification of the factory itself: no secrets, ephemeral trust.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --frozen
      - name: Install openshell-prover v0.1.2 (static musl build, checksum-verified)
        run: |
          base=https://github.com/NVIDIA/OpenShell/releases/download/v0.1.2
          asset=openshell-prover-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO "$base/$asset" && curl -fsSLO "$base/openshell-prover-checksums-sha256.txt"
          grep " \*\?$asset\$" openshell-prover-checksums-sha256.txt | sha256sum -c -
          mkdir -p .tools/bin && tar -xzf "$asset" -C .tools/bin openshell-prover
      - name: Compile, prove and gate the example behaviours (ephemeral trust)
        run: |
          F="uv run --frozen python -m factory"
          $F trust-init
          for b in ust-rfq-nyc gilt-rfq-ldn; do
            $F approve-spec "$b" --by ci
            $F compile "$b"
            $F evidence "$b"
            $F gate "$b"
          done
      - name: Builder sandbox is within the pinned boundary
        run: uv run --frozen python -m factory sandbox-check
      - name: Gate qualification benchmark
        run: uv run --frozen python -m factory qualify-gate
