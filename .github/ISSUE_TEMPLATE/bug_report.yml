name: Bug report
description: Something behaves differently from the documentation or a stated invariant.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues (gate bypass, evidence forgery, secret exposure, sandbox escape) must be reported privately.
        See [SECURITY.md](https://github.com/moduscorepub/behaviour-release-factory/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands run, behaviour or scenario used, and any minimal inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual behaviour
      description: Include the gate decision or obligation record if relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, uv version
