name: Bug report
description: Report something that doesn't work as the documentation describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please report security problems privately instead of in an issue, e.g., a way around the gate, forged results, exposed secrets or a way out of the sandbox.
        [SECURITY.md](https://github.com/moduscorepub/behaviour-release-factory/blob/main/SECURITY.md) explains how to report them.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the commands that you ran and the desk or scenario that you used, and attach any small input files that are needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
      description: If the gate or a check was involved, include its output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Operating system, Python version and uv version
