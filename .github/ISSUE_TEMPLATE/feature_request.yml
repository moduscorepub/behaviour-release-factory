name: Feature request
description: Propose a new capability, obligation, adapter or invariant.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What delivery or assurance problem does this solve, and what do you do today instead?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: The externally observable behaviour, including how the gate should treat it (PASS / FAIL / INCONCLUSIVE).
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How it would be verified
      description: Which scenario, obligation or adversarial case would prove it works and cannot be bypassed?
