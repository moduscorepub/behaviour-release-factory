# The approved requirements of the desk, and the checks that verify each requirement.
spec_id: ust-rfq-nyc
revision: 1
source:
  confluence_page_id: "100001"
  page_version: 7
  content_digest: "sha256:4803bdddb2abdd1b9194a3b6f0b0782269b6d383e114f570f4cd64a21e97a15d"

requirements:
  - id: UST-RFQ-001
    statement: Each client price request for a Treasury benchmark creates exactly one RFQ, with the side, the benchmark and the amount that the client asked for.
    criticality: critical
    verified_by: [scenario:new-rfq, eval:standard, eval:shorthand]
  - id: UST-RFQ-002
    statement: Once an RFQ is cancelled, a late or repeated reply from a trader must not reactivate the RFQ or send it anywhere.
    criticality: critical
    verified_by: [scenario:cancel-then-late-ack, explore]
  - id: UST-RFQ-003
    statement: After a repeated delivery, a reconnection or a restart, the engine never sends anything twice and never loses a client message.
    criticality: critical
    verified_by: [scenario:duplicate-delivery, scenario:crash-recovery, explore]
  - id: UST-RFQ-004
    statement: Quoted chat history is never treated as a new request.
    criticality: critical
    verified_by: [scenario:quoted-history, eval:quoted_history]
  - id: UST-RFQ-005
    statement: The engine doesn't create an RFQ if the amount is outside the range of 1 million to 500 million, or if the side, the amount or the benchmark is unclear.
    criticality: critical
    verified_by: [scenario:oversize-abstains, eval:ambiguous]
  - id: UST-RFQ-006
    statement: Changes and cancellations apply to the most recent open RFQ of the client.
    criticality: standard
    verified_by: [scenario:amend-latest, eval:amend_cancel]
  - id: UST-RFQ-007
    statement: Requests for other products in the same rooms aren't Treasury RFQs, e.g., requests for swaps, credit default swaps, German bonds, gilts or futures.
    criticality: critical
    verified_by: [scenario:other-desk-ignored, eval:other_desk]
  - id: UST-RFQ-008
    statement: When a trader picks up an RFQ, the engine posts one LIVE message in the chat of the Treasury traders.
    criticality: standard
    verified_by: [scenario:ack-posts-suggestion]

work_items:
  - id: ust-rfq-capture
    summary: Create Treasury RFQs from client chat
    satisfies: [UST-RFQ-001, UST-RFQ-004, UST-RFQ-005, UST-RFQ-007]
    jira_key: DESK-101
  - id: ust-rfq-lifecycle
    summary: Handle the pick-up, changes, cancellation and recovery of Treasury RFQs safely
    satisfies: [UST-RFQ-002, UST-RFQ-003, UST-RFQ-006, UST-RFQ-008]
    jira_key: DESK-102
