# The file holds the OpenShell sandbox settings for an AI coding agent, e.g., Claude Code, that works on the repository.
# The repository is mounted at /sandbox/workspace. Builders may propose changes to the file, but
# `factory sandbox-check` must prove that the settings stay within policy/builder-boundary.yaml.
#
# Start the sandbox with the following command:
#   openshell sandbox create --name builder --provider claude-code \
#     --policy sandbox/builder-policy.yaml -- claude
#
# The settings below don't list trust/ or state/, so the agent can't reach them. The agent can change
# code and run unsigned checks, but it can't sign results or approve requirements. It also can't edit
# the policy or contact delivery systems.
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
    - /app
    - /sandbox/workspace/factory
    - /sandbox/workspace/policy
    - /sandbox/workspace/examples
    - /sandbox/workspace/pyproject.toml
    - /sandbox/workspace/uv.lock
  read_write:
    - /sandbox/workspace/behaviours
    - /sandbox/workspace/runtime
    - /sandbox/workspace/build
    - /sandbox/workspace/.venv
    - /tmp
    - /dev/null

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1500"
  run_as_group: "1500"

network_policies:
  claude_inference:
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/local/bin/claude
  python_packages:
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/local/bin/uv
