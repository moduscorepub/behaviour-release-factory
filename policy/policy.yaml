# The file holds the rules that the gate enforces. Approvers own the file, and trust/pins.json records a hash of it.
# If someone edits the file and doesn't run trust-init again, the gate answers FAIL for every release.
policy_version: 1

desks:
  NYC-UST:
    destinations: ["bus:rfq/nyc/ust", "chat:UST-TRADERS"]
  LDN-GILTS:
    destinations: ["bus:rfq/ldn/gilts", "chat:GILT-TRADERS"]

# The list below gives the effects that a component may declare at each stage of the pipeline.
stage_effects:
  enrichment: ["write:derived_text"]
  parser: ["read:refdata"]
  converter: ["emit:payload"]

# Every release must pass the checks below, and "scenarios" means every scenario in the release.
obligations: [static:schema, static:traceability, static:composition, static:effects, interference, scenarios, eval, explore, mutation]

evaluation:
  min_wilson_lower: 0.55        # The lowest accuracy allowed in a category, as the lower bound of a 95% confidence interval.
  slice_floors: {standard: 0.65}
  zero_harm_slices: [other_desk, ambiguous, quoted_history]
  paired_alpha: 0.05            # The significance level for deciding that a category got worse than in the live release.

exploration:
  max_examples: 400             # The number of unusual sequences of events that the checker tries for each release.

mutation:
  explore_examples: 150         # The number of sequences of events that the checker tries against each deliberately broken engine.

promotion:
  behaviour: {auto: true, blocking_flags: [new_destination, trigger_scope_widened]}
  runtime: {auto: false}        # A change to shared engine code needs approval from a named person.

# The map below turns release states into Jira statuses, and your team decides what "Done" means.
jira:
  project: DESK
  status: {todo: "To Do", in_progress: "In Progress", blocked: "Blocked", qualified: "In Review", activated: "Done"}
