# The file sets the most access that the sandbox of an AI coding agent may have in the repository.
# Approvers own the file, and trust/pins.json records a hash of it. The sandbox settings of an agent
# are only accepted if openshell-prover proves that the settings allow nothing beyond the file.
# The file gives no access to trust/ or state/, and it gives no write access to factory/ or policy/.
# It also gives no route to Jira, Confluence, the chat platform, the message bus, GitHub or production data.
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
    - /app
    - /sandbox/workspace/factory
    - /sandbox/workspace/policy
    - /sandbox/workspace/examples
    - /sandbox/workspace/pyproject.toml
    - /sandbox/workspace/uv.lock
    - /sandbox/workspace/README.md
  read_write:
    - /sandbox/workspace/behaviours
    - /sandbox/workspace/runtime
    - /sandbox/workspace/build
    - /sandbox/workspace/.venv
    - /tmp
    - /dev/null

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1500"
  run_as_group: "1500"

network_policies:
  claude_inference:
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/local/bin/claude
  python_packages:
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/local/bin/uv
